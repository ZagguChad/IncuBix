  /api/v1/destinations/{destination_id}/validate:
    post:
      tags:
      - destinations
      summary: Validate Destination
      operationId: validate_destination_api_v1_destinations__destination_id__validate_post
      parameters:
      - name: destination_id
        in: path
        required: true
