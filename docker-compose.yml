services:
  test:
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: sqlite:///./data/test.db
      SIMULATION_MODE: "true"
      S3_BUCKET: incubrix-test
      PYTHONDONTWRITEBYTECODE: "1"
    profiles: ["tools"]

  api:
    build:
      context: .
      target: runtime
    image: incubrix-api:latest
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_API_KEY: ${APP_API_KEY:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,testserver}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-29360128}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      CONNECTOR_CONTRACT_ENABLED: ${CONNECTOR_CONTRACT_ENABLED:-true}
      ARTIFACT_SOURCE_FETCH_ENABLED: ${ARTIFACT_SOURCE_FETCH_ENABLED:-true}
      RULE_PAGE_FETCH_ENABLED: ${RULE_PAGE_FETCH_ENABLED:-true}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-localhost,127.0.0.1,lemmy,ghost,discourse,mock-platforms}
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-localhost,127.0.0.1,lemmy,ghost,discourse,mock-platforms}
      MEDIA_IMPORT_ALLOWED_HOSTS: ${MEDIA_IMPORT_ALLOWED_HOSTS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://incubrix:${APP_DB_PASSWORD:-incubrix_dev}@postgres:5432/incubrix}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      S3_BUCKET: ${S3_BUCKET:-incubrix-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3-mock:5000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:5000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-testing}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-testing}
      PRESIGNED_URL_TTL_SECONDS: ${PRESIGNED_URL_TTL_SECONDS:-3600}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-1}
      CERTIFICATION_ALLOWED_HOSTS: ${CERTIFICATION_ALLOWED_HOSTS:-localhost,127.0.0.1,lemmy,ghost,discourse,mock-platforms}
      DISCOURSE_API_KEY: ${DISCOURSE_API_KEY:-local-mock-key}
      DISCOURSE_API_USERNAME: ${DISCOURSE_API_USERNAME:-system}
      LEMMY_JWT: ${LEMMY_JWT:-local-lemmy-jwt}
      DEVTO_API_KEY: ${DEVTO_API_KEY:-local-mock-key}
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY:-localghostkey1234:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GHOST_ADMIN_API_VERSION: ${GHOST_ADMIN_API_VERSION:-v5.0}
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:-local-partner-secret}
      MASTODON_ACCESS_TOKEN: ${MASTODON_ACCESS_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      HASHNODE_PERSONAL_ACCESS_TOKEN: ${HASHNODE_PERSONAL_ACCESS_TOKEN:-}
      PEERTUBE_ACCESS_TOKEN: ${PEERTUBE_ACCESS_TOKEN:-}
      RECERTIFICATION_MAX_AGE_DAYS: ${RECERTIFICATION_MAX_AGE_DAYS:-30}
      RECERTIFICATION_RETEST_LEAD_DAYS: ${RECERTIFICATION_RETEST_LEAD_DAYS:-2}
      MOCK_DISCOURSE_KEY: ${MOCK_DISCOURSE_KEY:-local-mock-key}
      MOCK_DEVTO_KEY: ${MOCK_DEVTO_KEY:-local-mock-key}
      MOCK_GHOST_ADMIN_KEY: ${MOCK_GHOST_ADMIN_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-mock:
        condition: service_healthy
      lemmy:
        condition: service_started
      ghost:
        condition: service_started
      mock-platforms:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incubrix
      POSTGRES_USER: incubrix
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-incubrix_dev}
    volumes:
      - incubrix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incubrix -d incubrix"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3-mock:
    build:
      context: ./infra/moto
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mock-platforms:
    build:
      context: ./infra/mock-platforms
    environment:
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:-local-partner-secret}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  lemmy-config:
    image: python:3.12-alpine
    entrypoint: ["python", "/scripts/generate_lemmy_config.py"]
    environment:
      LEMMY_DATABASE_URL: ${LEMMY_DATABASE_URL:-postgresql://lemmy:lemmy_local_only@lemmy-postgres:5432/lemmy}
      LEMMY_PICTRS_KEY: ${LEMMY_PICTRS_KEY:-lemmy_pictrs_local_only}
    volumes:
      - ./infra/lemmy-config.template.hjson:/templates/lemmy-config.template.hjson:ro
      - ./infra/generate_lemmy_config.py:/scripts/generate_lemmy_config.py:ro
      - lemmy-config:/generated

  lemmy-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: ${LEMMY_DB_PASSWORD:-lemmy_local_only}
    volumes:
      - lemmy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy -d lemmy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pictrs:
    image: asonix/pictrs:0.5.25
    environment:
      PICTRS__SERVER__API_KEY: ${LEMMY_PICTRS_KEY:-lemmy_pictrs_local_only}
    volumes:
      - pictrs-data:/mnt
    restart: unless-stopped

  lemmy:
    image: dessalines/lemmy:1.0.0-beta.1
    environment:
      RUST_LOG: warn
      LEMMY_CONFIG_LOCATION: /config/config.hjson
    volumes:
      - lemmy-config:/config:ro
    ports:
      - "127.0.0.1:8536:8536"
    depends_on:
      lemmy-config:
        condition: service_completed_successfully
      lemmy-postgres:
        condition: service_healthy
      pictrs:
        condition: service_started
    restart: unless-stopped

  ghost-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD:-ghost_root_local_only}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:-ghost_local_only}
    volumes:
      - ghost-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${GHOST_DB_ROOT_PASSWORD:-ghost_root_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ghost:
    image: ghost:5-alpine
    environment:
      url: http://localhost:2368
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:-ghost_local_only}
      database__connection__database: ghost
    ports:
      - "127.0.0.1:2368:2368"
    depends_on:
      ghost-db:
        condition: service_healthy
    volumes:
      - ghost-data:/var/lib/ghost/content
    restart: unless-stopped

volumes:
  incubrix-postgres:
  lemmy-postgres:
  lemmy-config:
  pictrs-data:
  ghost-mysql:
  ghost-data:
