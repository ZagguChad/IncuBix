key: hashnode
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: publication
    content_types: [article, text]
    spec: {title_max_chars: 200, body_max_chars: 100000, links_allowed: true}
rate_limits:
  per_connection: {requests: 20, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "403": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: publication_id
