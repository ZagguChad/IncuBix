key: discord-webhook
version: 1.0.0
tier: bridge
auth: bot_token
surfaces:
  - key: webhook_message
    content_types: [text]
    spec: {body_max_chars: 2000, links_allowed: true}
rate_limits:
  per_connection: {requests: 20, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: webhook_url_env
