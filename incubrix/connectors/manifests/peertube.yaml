key: peertube
version: 1.0.0
tier: native
auth: oauth2
surfaces:
  - key: video
    content_types: [video_link]
    spec: {title_max_chars: 120, body_max_chars: 5000, links_allowed: true}
rate_limits:
  per_connection: {requests: 10, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "403": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: base_url
