key: signed-webhook
version: 1.0.0
tier: protocol
auth: api_key
surfaces:
  - key: partner
    content_types: [text, image, video_link, article]
    spec: {title_max_chars: 300, body_max_chars: 50000, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: base_url
