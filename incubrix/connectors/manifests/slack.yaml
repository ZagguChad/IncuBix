key: slack
version: 1.0.0
tier: bridge
auth: bot_token
surfaces:
  - key: message
    content_types: [text, article]
    spec: {body_max_chars: 40000, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "403": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: channel_id
